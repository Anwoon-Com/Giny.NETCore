name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "2.68" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore
        run: dotnet restore Sources/Giny.sln

      - name: Build
        run: dotnet build Sources/Giny.sln --no-restore -c Release
